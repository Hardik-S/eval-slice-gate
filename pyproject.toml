[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-slice-gate"
version = "0.1.0"
description = "Strict offline coverage and pass-rate checks for evaluation slices"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hardik Shrestha"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
eval-slice-gate = "eval_slice_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
